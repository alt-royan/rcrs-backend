syntax = "proto3";

package events;

option java_package = "org.ultra.rcrs.events.playlist";

import "events/common/playlist_type.proto";

message CreatePlaylistEvent {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  string description = 4;
  string cover_s3_key = 5;
  bool is_private = 6;
  repeated string tags = 7;
  repeated string track_ids = 8;
  PlaylistType type = 9;
}
