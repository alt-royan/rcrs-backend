syntax = "proto3";

package events;

option java_package = "org.ultra.rcrs.events.track";

// Partial update of a track: only the fields present are meant to be applied,
// absent fields must be left untouched by consumers.
message TrackUpdatedEvent {
  string id = 1;
  optional string title = 2;
  optional int32 duration_ms = 3;
  optional int32 track_number = 4;
  optional bool explicit = 5;
}
