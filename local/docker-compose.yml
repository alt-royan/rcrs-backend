services:
  # ==================== Application ====================

  discovery-server:
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - rcrs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway-api:
    build:
      context: ..
      dockerfile: gateway-api/Dockerfile
    container_name: gateway-api
    ports:
      - "8099:8099"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
      metadata-write-service:
        condition: service_started
      metadata-read-service:
        condition: service_started
      search-service:
        condition: service_started
      media-service:
        condition: service_started
      user-service:
        condition: service_started
      workflow-service:
        condition: service_started
    networks:
      - rcrs

  metadata-write-service:
    build:
      context: ..
      dockerfile: services/metadata-write-service/Dockerfile
    container_name: metadata-write-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_HIBERNATE_DEFAUT_SCHEMA: rcrs_catalog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_LIQUIBASE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      CDN_IMAGES_ENDPOINT: http://192.168.1.3:4566/images
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

  metadata-read-service:
    build:
      context: ..
      dockerfile: services/metadata-read-service/Dockerfile
    container_name: metadata-read-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://192.168.1.3:27017/rcrs_catalog
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      CDN_IMAGES_ENDPOINT: http://192.168.1.3:4566/images
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    container_name: search-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      SPRING_ELASTICSEARCH_URIS: http://192.168.1.3:9200
      CDN_IMAGES_ENDPOINT: http://192.168.1.3:4566/images
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

  media-service:
    build:
      context: ..
      dockerfile: services/media-service/Dockerfile
    container_name: media-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      SPRING_TEMPORAL_CONNECTION_TARGET: 192.168.1.3:7233
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_HIBERNATE_DEFAUT_SCHEMA: rcrs_media
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_LIQUIBASE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      SPRING_CLOUD_AWS_REGION_STATIC: eu-west-1
      SPRING_CLOUD_AWS_ENDPOINT: http://192.168.1.3:4566
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
      AUDIO_BUCKET_NAME: rcrs-audio
      AUDIO_BUCKET_PUBLIC_URL: http://192.168.1.3:4566/rcrs-audio
      AUDIO_VALIDATION_FORMATS: mp3, wav, ogg, flac
      AUDIO_VALIDATION_DURATION_MIN: 1s
      AUDIO_VALIDATION_DURATION_MAX: 2h
      AUDIO_BITRATES: 128k, 192k, 320k
      AUDIO_CODEC: libvorbis
      AUDIO_RATE: 44100
      AUDIO_FORMAT: ogg
      AUDIO_LOUDNORM_I: -18
      AUDIO_LOUDNORM_LRA: 18
      AUDIO_LOUDNORM_TP: -1
      IMAGE_BUCKET_NAME: images
      IMAGE_BUCKET_PUBLIC_URL: http://192.168.1.3:4566/images
      IMAGE_THUMBNAILS_SIZES: 64,300,640
      UPLOAD_BUCKET_NAME: rcrs-upload
      UPLOAD_BUCKET_PUBLIC_URL: http://192.168.1.3:4566/rcrs-upload
      UPLOAD_SIGNATURE_DURATION: 24h
      UPLOAD_UPLOAD_DURATION: 24h
      SQS_QUEUE: rcrs-upload-event-queue
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_HIBERNATE_DEFAUT_SCHEMA: rcrs_user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_LIQUIBASE_URL: jdbc:postgresql://192.168.1.3:5432/postgres
      SPRING_LIQUIBASE_USER: postgres
      SPRING_LIQUIBASE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

  workflow-service:
    build:
      context: ..
      dockerfile: services/workflow-service/Dockerfile
    container_name: workflow-service
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 192.168.1.3:29092
      SPRING_TEMPORAL_CONNECTION_TARGET: 192.168.1.3:7233
      WORKFLOW_PURGE_CRON: "0 0 4 1 * *"
      FEIGN_METADATA-SERVICE_URL: http://metadata-write-service:8080
      FEIGN_MEDIA-SERVICE_URL: http://media-service:8082
      FEIGN_SEARCH-SERVICE_URL: http://search-service:8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://192.168.1.3:8180/realms/master
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
      OAUTH2_CLIENT_PROVIDER_ISSUER_URI: http://192.168.1.3:8180/realms/master
      OAUTH2_CLIENT_PROVIDER_USERNAME_ATTRIBUTE: preferred_username
      OAUTH2_CLIENT_REGISTRATION_CLIENT_ID: workflow-client
      OAUTH2_CLIENT_REGISTRATION_CLIENT_SECRET: In8bQ3Yq0F8pwyJNQ3yNDKdnAoCu8vBM
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - rcrs

networks:
  rcrs:
    external: true
