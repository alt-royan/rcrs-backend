server:
  port: 8083
spring:
  application:
    name: search-service
  kafka:
    bootstrap-servers: localhost:9092
    reindex:
      batch:
        size: 1000
  elasticsearch:
    uris: localhost:9200
  security:
    admin:
      client-id: rcrs-admin-panel
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.3:8180/realms/master
          jwk-set-uri: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs

image:
  cdn:
    endpoint: "http://images.localhost:4566"
  thumbnails:
    sizes:
      sm: 128
      md: 512
      lg: 1024

springdoc:
  api-docs:
    path: /api/search/v3/api-docs
  swagger-ui:
    path: /api/search/swagger-ui.html

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized