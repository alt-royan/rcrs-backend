server:
  port: 8090

workflow:
  purge:
    cron: "0 0 4 1 * *"

spring:
  application:
    name: workflow-service
  cloud:
    openfeign:
      oauth2:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
  security:
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.3:8180/realms/master
          jwk-set-uri: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
      client:
        provider:
          metadata-write-service:
            issuer-uri: http://192.168.1.3:8180/realms/master
            user-name-attribute: preferred_username
        registration:
          metadata-write-service:
            client-id: workflow-client
            client-secret: 35Br8un5yvUJ8atsjZBlLMpsb0Ust9az
            authorization-grant-type: client_credentials
  temporal:
    connection:
      target: 127.0.0.1:7233
    workflow:

    workers:
      capacity:
        max-concurrent-workflow-task-pollers: 6
        max-concurrent-activity-task-pollers: 6
      rate-limits:
        max-worker-activities-per-second: 2
        max-task-queue-activities-per-second: 2
    workflow-cache:
      max-instances: 10
      max-threads: 10
    workersAutoDiscovery:
      packages: org.ultra.rcrs.workflow
    namespace: default
    activities:
      artist:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 5
      album:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 5
      track:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 5
      audio:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 5
      transcoding:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 5
      purge:
        start-to-close-timeout: 1m
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 30s
          maximum-attempts: 3

feign:
  metadata-service:
    url: http://localhost:8080
  media-service:
    url: http://localhost:8082
  search-service:
    url: http://localhost:8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
