server:
  port: 8081

spring:
  application:
    name: metadata-read-service
  mongodb:
    uri: mongodb://192.168.1.3:27017/rcrs_catalog
  kafka:
    bootstrap-servers: 192.168.1.3:9092
  security:
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.3:8180/realms/master
          jwk-set-uri: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs

cdn:
  images:
    endpoint: "http://192.168.1.3:4566/images"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized