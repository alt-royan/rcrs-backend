server:
  port: 8082

spring:
  application:
    name: media-service
  temporal:
    connection:
      target: 127.0.0.1:7233
    namespace: default
    workers:
      capacity:
        max-concurrent-workflow-task-pollers: 50
        max-concurrent-activity-task-pollers: 50
      rate-limits:
        max-worker-activities-per-second: 10
        max-task-queue-activities-per-second: 10
    workflow-cache:
      max-instances: 10
      max-threads: 10
    activities:
      validate:
        start-to-close-timeout: 10s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 10s
          maximum-attempts: 3
      thumbnail:
        start-to-close-timeout: 15s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 15s
          maximum-attempts: 3
      probeAudioMetadata:
        start-to-close-timeout: 30s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 15s
          maximum-attempts: 3
      s3Activity:
        start-to-close-timeout: 15s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 15s
          maximum-attempts: 3
      dbActivity:
        start-to-close-timeout: 10s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 10s
          maximum-attempts: 3
      transcodeAudioActivity:
        start-to-close-timeout: 3m
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 1m
          maximum-attempts: 3
      transcodingStatus:
        start-to-close-timeout: 10s
        retry:
          initial-interval: 1s
          backoff-coefficient: 2
          maximum-interval: 10s
          maximum-attempts: 3
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    user: postgres
    password: postgres
    url: jdbc:postgresql://laptop-smgs968r:5432/postgres
    database-change-log-table: media_databasechangelog
    database-change-log-lock-table: media_databasechangeloglock
  datasource:
    url: jdbc:postgresql://laptop-smgs968r:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: rcrs_media
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
  security:
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.3:8180/realms/master
          jwk-set-uri: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: eu-west-1
      endpoint: http://localhost.localstack.cloud:4566
      s3:
        path-style-access-enabled: true

image:
  cdn:
    endpoint: "http://images.localhost:4566"
  thumbnails:
    sizes:
      sm: 128
      md: 512
      lg: 1024

media:
  audio:
    bucket:
      name: rcrs-stream
    signature-duration: 30m
    validation:
      formats: mp3, wav, ogg, flac
      duration:
        min: 1s
        max: 2h
    quality:
      low: 96k
      mid: 128k
      high: 192k
    codec: aac
    rate: 44100
    format: m4a
    content-type: audio/mp4
    loudnorm:
      enabled: true
      I: -18
      LRA: 18
      TP: -1
  image:
    bucket:
      name: images
      public-url: http://images.localhost:4566
  upload:
    bucket:
      name: rcrs-upload
      public-url: http://upload.localhost:4566
    signature-duration: 24h
    upload-duration: 24h
  download:
    bucket:
      name: rcrs-download
      public-url: http://download.localhost:4566
    signature-duration: 1h
  sqs:
    queue: rcrs-upload-event-queue

springdoc:
  api-docs:
    path: /media/v3/api-docs
  swagger-ui:
    path: /media/swagger-ui.html

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
