server:
  port: 8099

spring:
  application:
    name: gateway-api
  security:
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.3:8180/realms/master
          jwk-set-uri: http://192.168.1.3:8180/realms/master/protocol/openid-connect/certs
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
          discovery:
            locator: enabled
          routes:
            # user-service — owns /me prefix itself, gateway only routes
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/me/**

            # workflow-service — owns /workflow prefix itself, gateway only routes
            - id: workflow-service
              uri: lb://workflow-service
              predicates:
                - Path=/workflow/**

            # media-service — owns /media prefix itself, gateway only routes
            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/media/**

            # search-service — owns /api/search prefix itself, gateway only routes
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**

            # metadata-read-service — owns /api/catalog prefix itself, gateway only routes
            - id: metadata-read-service
              uri: lb://metadata-read-service
              predicates:
                - Path=/api/catalog/**

            # metadata-write — NOT available via gateway

            # playlist-service — owns /playlists prefix itself, gateway only routes
            - id: playlist-service
              uri: lb://playlist-service
              predicates:
                - Path=/playlists/**
springdoc:
  swagger-ui:
    urls:
      - name: catalog
        url: /api/catalog/v3/api-docs
      - name: search
        url: /api/search/v3/api-docs
      - name: media
        url: /media/v3/api-docs
      - name: workflow
        url: /workflow/v3/api-docs
      - name: user
        url: /me/v3/api-docs
      - name: playlist
        url: /playlists/v3/api-docs

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
