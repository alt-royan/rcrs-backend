server:
  port: 8099

spring:
  application:
    name: gateway-api
  security:
    enabled: true
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          discovery:
            locator: enabled
          routes:
            # user-service — prefix /me
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/me/**

            # workflow-service — prefix /workflow
            - id: workflow-service
              uri: lb://workflow-service
              predicates:
                - Path=/workflow/**

            # media-service — prefix /media
            - id: media-service
              uri: lb://media-service
              predicates:
                - Path=/media/**

            # search-service — no prefix
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**,/api/admin/search/**

            # metadata-read-service — no prefix
            - id: metadata-read-service
              uri: lb://metadata-read-service
              predicates:
                - Path=/api/catalog/**,/api/admin/catalog/**

            - id: playlist-service
              uri: lb://playlist-service
              predicates:
                - Path=/playlists/**

            - id: library-service
              uri: lb://library-service
              predicates:
                - Path=/me/library/**
            # metadata-write — NOT available via gateway
springdoc:
  swagger-ui:
    urls:
      - name: catalog
        url: /api/catalog/v3/api-docs
      - name: search
        url: /api/search/v3/api-docs
      - name: media
        url: /media/v3/api-docs
      - name: workflow
        url: /workflow/v3/api-docs
      - name: user
        url: /me/v3/api-docs
      - name: playlists
        url: /playlists/v3/api-docs
      - name: library
        url: /me/library/v3/api-docs

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
  instance:
    preferIpAddress: true

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2.server.resource: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"